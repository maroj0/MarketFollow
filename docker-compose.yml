
services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: stock-tracker
    restart: unless-stopped
    ports:
      - "8081:8081"
    environment:
      - MONGO_URI=${MONGO_URI}
      - API_KEY_ALPHAVANTAGE=${API_KEY_ALPHAVANTAGE}
    depends_on:
      - mongo
    networks:
      - stock-network

  mongo:
    image: mongo:6.0
    container_name: mongo
    restart: unless-stopped
    environment:
      MONGO_INITDB_ROOT_USERNAME: ${MONGO_INITDB_ROOT_USERNAME:-root}
      MONGO_INITDB_ROOT_PASSWORD: ${MONGO_INITDB_ROOT_PASSWORD:-example}
    volumes:
      - mongodb_data:/data/db
    ports:
      - "27017:27017"
    networks:
      - stock-network

networks:
  stock-network:
    driver: bridge

volumes:
  mongodb_data:
